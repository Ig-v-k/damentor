name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax-check:
    name: Python syntax
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python sources
        shell: pwsh
        run: |
          python -m compileall -q .
